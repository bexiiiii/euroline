#         order_updates: true
#         jdbc.batch_versioned_data: true

# Kaspi Pay top-ups via kaspi-pos-automation sidecar (docker/kaspi-pos, service "kaspi")
kaspi:
  enabled: ${KASPI_ENABLED:true}
  sidecar-url: ${KASPI_SIDECAR_URL:http://localhost:3010}
  min-amount: ${KASPI_MIN_AMOUNT:100}
  max-amount: ${KASPI_MAX_AMOUNT:1000000}
  max-pending-per-client: ${KASPI_MAX_PENDING_PER_CLIENT:3}
  invoice-ttl: ${KASPI_INVOICE_TTL:PT24H}
  poll-interval-ms: ${KASPI_POLL_INTERVAL_MS:5000}
